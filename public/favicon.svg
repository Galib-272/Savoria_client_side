<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="30%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#gold)" stroke-width="8" stroke-opacity="0.45"/>

  <!-- Main Restaurant Emblem: Cloche & Crossed Fork/Knife -->
  <g filter="url(#shadow)">
    <!-- Serving Cloche Dome -->
    <!-- Handle -->
    <circle cx="256" cy="116" r="20" fill="url(#gold)"/>
    <rect x="250" y="132" width="12" height="14" rx="4" fill="url(#gold)"/>

    <!-- Cloche Bell -->
    <path d="M128 238 C132 160 186 142 256 142 C326 142 380 160 384 238 Z" fill="#FFFFFF"/>
    
    <!-- Cloche Rim -->
    <path d="M112 242 C112 237 116 234 122 234 L390 234 C396 234 400 237 400 242 L394 254 C391 259 385 262 378 262 L134 262 C127 262 121 259 118 254 Z" fill="url(#gold)"/>
    
    <!-- Serving Platter Plate Base -->
    <rect x="96" y="268" width="320" height="18" rx="9" fill="#FFFFFF"/>
    <rect x="136" y="286" width="240" height="8" rx="4" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- Crossed Fork and Knife below platter -->
  <g filter="url(#shadow)" transform="translate(0, 16)">
    <!-- Fork (angled from left) -->
    <g transform="translate(256, 370) rotate(-38) translate(-256, -370)">
      <!-- Fork Prongs -->
      <path d="M242 300 L242 334 C242 344 248 352 256 352 C264 352 270 344 270 334 L270 300" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <line x1="251" y1="300" x2="251" y2="334" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <line x1="261" y1="300" x2="261" y2="334" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <!-- Fork Stem and Handle -->
      <path d="M256 352 L256 430" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="256" cy="432" r="7" fill="url(#gold)"/>
    </g>

    <!-- Knife (angled from right) -->
    <g transform="translate(256, 370) rotate(38) translate(-256, -370)">
      <!-- Knife Blade -->
      <path d="M256 300 C267 312 270 335 270 352 L256 352 Z" fill="#FFFFFF"/>
      <path d="M256 300 L256 352" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <!-- Knife Handle -->
      <path d="M256 352 L256 430" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="256" cy="432" r="7" fill="url(#gold)"/>
    </g>

    <!-- Center Gourmet Star Accent -->
    <polygon points="256,358 261,372 276,372 264,381 268,396 256,386 244,396 248,381 236,372 251,372" fill="url(#gold)"/>
  </g>
</svg>